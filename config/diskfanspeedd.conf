; diskfanspeedd configuration
; Install to /etc/diskfanspeed/diskfanspeedd.conf

[serial]
; USB-CDC port the Arduino Uno enumerates as
port = /dev/ttyACM0
baud = 9600

[daemon]
; how often (seconds) to poll disk temps and recompute fan speed
poll_interval = 30
; control socket used by the diskfanspeed CLI
socket_path = /run/diskfanspeedd.sock
; group allowed to connect to the control socket (besides root)
socket_group = diskfanspeed
; where to persist last-known-good state across restarts (last temps, mode)
state_file = /var/lib/diskfanspeedd/state.json

[fan_curve]
; below min_temp_c: fans off (min_pwm). min_temp_c..max_temp_c: linear
; ramp. above max_temp_c: full speed (max_pwm). Based on the HIGHEST
; temperature seen across all configured disks.
min_temp_c = 35
max_temp_c = 45
min_pwm = 0
max_pwm = 100
; used when mode is switched to "full"
full_pwm = 100
; used once every disk has been continuously asleep/unreadable for
; idle_delay_s (all disks idle implies no disk is above min_temp_c, so
; fans stay off)
idle_pwm = 0
; how long (seconds) every disk must be continuously asleep/unreadable
; before dropping to idle_pwm. Until then the fan holds its last speed,
; so a disk napping for a minute or two doesn't spin the fans down and
; back up. Default 3600 = 1 hour.
idle_delay_s = 3600

[disks]
; comma-separated list of block devices to monitor.
; USB-SATA bridges usually need -d sat; override per-disk below if needed.
devices = /dev/sdb, /dev/sdc, /dev/sdd, /dev/sde
smart_device_type = sat

; Per-disk override example (uncomment and edit if one enclosure needs a
; different -d type, e.g. usbjmicron,0 for some JMicron bridges):
; [disk:/dev/sdc]
; smart_device_type = usbjmicron,0
